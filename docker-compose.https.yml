# Class 5 HTTPS lab. Keep the local override when using this overlay:
# docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.https.yml up -d
services:
  web:
    ports: !reset []
    expose:
      - "5000"

  nginx:
    image: nginx:1.27
    depends_on:
      - web
    ports:
      - "127.0.0.1:8443:443"
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
