# Plain HTTP only redirects to the HTTPS entrance.
server {
    listen 80;
    server_name localhost;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/certs/notesapp.crt;
    ssl_certificate_key /etc/nginx/certs/notesapp.key;

    # Leave the existing Flask 1 MiB upload limit in charge of HMAC uploads.
    client_max_body_size 2m;

    location / {
        proxy_pass http://web:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
